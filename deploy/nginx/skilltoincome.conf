# Skill to Income Academy - static site. Installed by deploy/setup.sh as /etc/nginx/conf.d/skilltoincome.conf

# Fair use per visitor: one page visit asks for about 20 files, so normal people never hit these limits;
# a script hammering the site gets "429 Too Many Requests" instead of slowing it down for everyone.
# (Behind Cloudflare, run deploy/cloudflare-realip.sh so these count real visitors, not Cloudflare's servers.)
limit_req_zone  $binary_remote_addr zone=s2i_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=s2i_conn:10m;

server {
    listen 80__DEFAULT__;
    server_name __DOMAIN__;

    root /var/www/skilltoincome;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers. Only add_header here (never inside a location), or nginx drops these for that location.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Scripts, styles and fonts come only from this site: nothing from outside can run or track visitors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # Browsers obey this only over HTTPS (after certbot): "always use HTTPS for this site for a year".
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Speed: compress text files (the 575 KB of page files travel as about 150 KB), keep open files in memory
    gzip on;
    gzip_vary on;
    gzip_static on;                   # update.sh saves a ready-compressed .gz copy of each file: no work per visit
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json text/plain image/svg+xml application/xml;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 16k;         # the site takes no uploads
    limit_req zone=s2i_req burst=120 nodelay;
    limit_conn s2i_conn 40;
    limit_req_status 429;
    limit_conn_status 429;
    # Only GET/HEAD make sense for a static site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Tools, notes and hidden files are not part of the public site
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(tools|deploy|dist)/ { return 404; }
    location ~ \.(md|py|sh|txt|txt\.gz)$ { return 404; }
    # ...except the files search engines need
    location = /robots.txt { }
    location = /sitemap.xml { }
    location = /fonts/OFL.txt { }

    # Link-check results change weekly: never cache
    location = /js/data/link-status.js { expires -1; }
    location /status/ { expires -1; }

    # update.sh adds ?v=<version> to every CSS/JS link in index.html, so these can be cached for long:
    # a new version gets a new address. The page itself is always checked for a newer version.
    location ~* \.(css|js)$ { expires 30d; }
    location ~* \.woff2$ { expires 365d; }
    location = /index.html { expires -1; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
